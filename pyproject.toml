[project]
name = "auto-video"
version = "0.1.0"
description = "Production-grade Manim video automation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "google-genai>=1.70.0",
    "mlx-audio",
    "whisper-timestamped",
    "soundfile",
    "numpy",
    "moviepy",
    "pyyaml",
    "misaki[en]",
    "num2words",
    "spacy",
    "phonemizer",
    "openai",
    "anthropic",
]

[project.optional-dependencies]
# Japanese TTS — run: uv sync --extra ja
ja = [
    "misaki[ja]",
]
# Korean TTS — run: uv sync --extra ko
ko = [
    "misaki[ko]",
]
# Chinese TTS — run: uv sync --extra zh
zh = [
    "misaki[zh]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# moviepy 2.2.1 (latest) pins pillow<12.0, but every fixed Pillow release is
# >=12.1.1. Force the patched version; moviepy's runtime use of Pillow's
# public API is unaffected (verified by smoke test).
override-dependencies = ["pillow>=12.1.1"]

[project.scripts]
render = "auto_video.cli:main"
