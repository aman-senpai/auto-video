[project]
name = "auto-video"
version = "0.1.0"
description = "Production-grade Manim video automation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18.0",
    "google-genai>=1.70.0",
    "mlx-audio",
    "whisper-timestamped",
    "soundfile",
    "numpy",
    "moviepy",
    "pyyaml",
    "misaki[en]",
    "num2words",
    "spacy",
    "phonemizer",
    "espeakng-loader",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
render = "auto_video.cli:main"
